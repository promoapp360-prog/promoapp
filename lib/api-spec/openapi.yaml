openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/verify:
    post:
      operationId: verifyAdminAccess
      summary: Verifica la password admin tramite JSON UTF-8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentialInput"
      responses:
        "200":
          description: Credenziale accettata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResult"
        "401": { description: Credenziale mancante o rifiutata }
        "429": { description: "Troppi tentativi, consultare Retry-After" }
        "503": { description: Password admin non configurata }
  /invia-contatto:
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Invia una richiesta di preventivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Richiesta salvata nel database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "500":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /admin/leads:
    get:
      operationId: listCommercialLeads
      tags: [contacts]
      parameters:
        - { name: servizio, in: query, schema: { type: string } }
        - { name: campagna, in: query, schema: { type: string } }
        - { name: tipoAttivita, in: query, schema: { type: string } }
        - { name: settore, in: query, schema: { type: string } }
        - { name: stato, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Contatti autorizzati
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CommercialLead" } }
        "401": { description: Accesso negato }
        "503": { description: Credenziale amministrativa non configurata }
  /admin/leads/{id}:
    patch:
      operationId: updateCommercialLead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Contatto aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommercialLead" }
        "401": { description: Accesso negato }
        "404": { description: Contatto non trovato }
  /admin/leads/{id}/notify:
    post:
      operationId: notifyCommercialLead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Notifica ritentata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "401": { description: Accesso negato }
  /admin/leads/export:
    get:
      operationId: exportCommercialLeads
      parameters:
        - { name: servizio, in: query, schema: { type: string } }
        - { name: campagna, in: query, schema: { type: string } }
        - { name: tipoAttivita, in: query, schema: { type: string } }
        - { name: settore, in: query, schema: { type: string } }
        - { name: stato, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV contatti con informativa accettata
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Accesso negato }
  /marketing-config:
    get:
      operationId: getTrackingConfig
      responses:
        "200":
          description: Identificativi pubblici dei tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingConfig" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AdminCredentialInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminAccessResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    TrackingConfig:
      type: object
      properties:
        gtmId: { type: string }
        ga4Id: { type: string }
        googleAdsId: { type: string }
        googleAdsLeadLabel: { type: string }
        metaPixelId: { type: string }
    LeadUpdate:
      type: object
      required: [stato]
      properties:
        qualified: { type: boolean }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        stato:
          type: string
          enum: [Nuovo, Contattato, Interessato, Preventivo inviato, Cliente acquisito, Non interessato]
    CommercialLead:
      type: object
      required: [id, nomeAttivita, settore, whatsapp, slug, stato, pagina, attribution, createdAt, notification, marketingConsent, analyticsConsent, events]
      properties:
        id: { type: string }
        nomeAttivita: { type: string }
        settore: { type: string }
        whatsapp: { type: string }
        slug: { type: string }
        servizio: { type: string }
        pagina: { type: string }
        variant: { type: string }
        stato: { type: string }
        notification: { type: string }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: ["string", "null"], format: date-time }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        marketingConsent: { type: boolean }
        analyticsConsent: { type: boolean }
        attribution: { type: object, additionalProperties: { type: string } }
        events:
          type: array
          items: { $ref: "#/components/schemas/LeadEvent" }
    LeadEvent:
      type: object
      required: [event, at]
      properties:
        event: { type: string }
        at: { type: string }
        quoteAmountCents: { type: ["integer", "null"], multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], multipleOf: 1 }
    ContactRequest:
      type: object
      required: [nome_attivita, settore, whatsapp, privacy]
      properties:
        nome_attivita:
          type: string
          minLength: 2
          maxLength: 160
        settore:
          type: string
          minLength: 2
          maxLength: 120
        whatsapp:
          type: string
          minLength: 6
          maxLength: 30
        messaggio:
          type: string
          maxLength: 5000
        privacy:
          type: boolean
          enum: [true]
        marketingConsent:
          type: boolean
        analyticsConsent:
          type: boolean
        slug:
          type: string
          maxLength: 120
        variant:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        servizio:
          type: string
          enum: [generale, siti-web, web-app, menu-digitali, general, website_399, menu_qr_99, webapp_custom, sector_custom]
        pagina:
          type: string
          maxLength: 200
        attribution:
          type: object
          additionalProperties: false
          properties:
            utm_source: { type: string, maxLength: 200 }
            utm_medium: { type: string, maxLength: 200 }
            utm_campaign: { type: string, maxLength: 200 }
            utm_term: { type: string, maxLength: 200 }
            utm_content: { type: string, maxLength: 200 }
            gclid: { type: string, maxLength: 200 }
            gbraid: { type: string, maxLength: 200 }
            wbraid: { type: string, maxLength: 200 }
        website:
          type: string
          maxLength: 0
    ContactResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        leadId:
          type: string
        duplicate:
          type: boolean
        notification:
          type: string
          enum: [sent, pending]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

