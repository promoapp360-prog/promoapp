openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/login:
    post:
      operationId: loginAdmin
      summary: Accede all’unico pannello e crea una sessione HttpOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentialInput"
      responses:
        "200":
          description: Credenziale accettata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401": { description: Credenziale mancante o rifiutata }
        "429": { description: "Troppi tentativi, consultare Retry-After" }
        "503": { description: Password admin non configurata }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Sessione valida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Accesso richiesto }
  /admin/logout:
    post:
      operationId: logoutAdmin
      responses:
        "200":
          description: Sessione chiusa nel browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Statistiche reali
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/contacts:
    get:
      operationId: listAdminContacts
      responses:
        "200":
          description: Contatti ricevuti, inclusi messaggi ed email
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminContact" } }
  /admin/contacts/{id}:
    patch:
      operationId: updateAdminContact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactStateInput" }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContact" }
        "404": { description: Contatto non trovato }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      responses:
        "200":
          description: Recensioni pubblicate e in attesa
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminReview" } }
  /admin/reviews/{id}:
    patch:
      operationId: moderateAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewPublicationInput" }
      responses:
        "200":
          description: Pubblicazione aggiornata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReview" }
        "404": { description: Recensione non trovata }
    delete:
      operationId: deleteAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Recensione eliminata }
        "404": { description: Recensione non trovata }
  /visits:
    post:
      operationId: recordSiteVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteVisitInput" }
      responses:
        "204": { description: Visualizzazione registrata o duplicato ignorato }
        "400": { description: Dati o consenso non validi }
  /invia-contatto:
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Invia una richiesta di preventivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Richiesta salvata nel database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "500":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /marketing-config:
    get:
      operationId: getTrackingConfig
      responses:
        "200":
          description: Identificativi pubblici dei tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingConfig" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AdminCredentialInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        csrfToken: { type: string }
    AdminContact:
      type: object
      required: [id, nomeAttivita, settore, whatsapp, messaggio, servizio, stato, createdAt]
      properties:
        id: { type: string }
        nomeAttivita: { type: string }
        settore: { type: string }
        whatsapp: { type: string }
        email: { type: ["string", "null"] }
        messaggio: { type: string }
        servizio: { type: string }
        pagina: { type: string }
        stato: { type: string }
        createdAt: { type: string, format: date-time }
    ContactStateInput:
      type: object
      required: [stato]
      properties:
        stato:
          type: string
          enum: [Nuovo, Contattato, Interessato, Preventivo inviato, Cliente acquisito, Non interessato]
    AdminReview:
      type: object
      required: [id, nome, attivita, testo, stelle, verificata, createdAt]
      properties:
        id: { type: string }
        nome: { type: string }
        attivita: { type: string }
        testo: { type: string }
        stelle: { type: string }
        verificata: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReviewPublicationInput:
      type: object
      required: [verificata]
      properties:
        verificata: { type: boolean }
    SiteVisitInput:
      type: object
      required: [id, sessionId, path, analyticsConsent]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        path: { type: string, minLength: 1, maxLength: 200 }
        analyticsConsent: { type: boolean, enum: [true] }
    VisitDay:
      type: object
      required: [date, visits, pageViews]
      properties:
        date: { type: string }
        visits: { type: integer }
        pageViews: { type: integer }
    VisitedPage:
      type: object
      required: [path, pageViews]
      properties:
        path: { type: string }
        pageViews: { type: integer }
    AdminOverview:
      type: object
      required: [days, contacts, newContacts, reviews, pendingReviews, averageRating, visits, pageViews, trackingStartedAt, daily, pages]
      properties:
        days: { type: integer }
        contacts: { type: integer }
        newContacts: { type: integer }
        reviews: { type: integer }
        pendingReviews: { type: integer }
        averageRating: { type: ["number", "null"] }
        visits: { type: integer }
        pageViews: { type: integer }
        trackingStartedAt: { type: ["string", "null"], format: date-time }
        daily: { type: array, items: { $ref: "#/components/schemas/VisitDay" } }
        pages: { type: array, items: { $ref: "#/components/schemas/VisitedPage" } }
    TrackingConfig:
      type: object
      properties:
        gtmId: { type: string }
        ga4Id: { type: string }
        googleAdsId: { type: string }
        googleAdsLeadLabel: { type: string }
        metaPixelId: { type: string }
    LeadUpdate:
      type: object
      required: [stato]
      properties:
        qualified: { type: boolean }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        stato:
          type: string
          enum: [Nuovo, Contattato, Interessato, Preventivo inviato, Cliente acquisito, Non interessato]
    CommercialLead:
      type: object
      required: [id, nomeAttivita, settore, whatsapp, slug, stato, pagina, attribution, createdAt, notification, marketingConsent, analyticsConsent, events]
      properties:
        id: { type: string }
        nomeAttivita: { type: string }
        settore: { type: string }
        whatsapp: { type: string }
        slug: { type: string }
        servizio: { type: string }
        pagina: { type: string }
        variant: { type: string }
        stato: { type: string }
        notification: { type: string }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: ["string", "null"], format: date-time }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        marketingConsent: { type: boolean }
        analyticsConsent: { type: boolean }
        attribution: { type: object, additionalProperties: { type: string } }
        events:
          type: array
          items: { $ref: "#/components/schemas/LeadEvent" }
    LeadEvent:
      type: object
      required: [event, at]
      properties:
        event: { type: string }
        at: { type: string }
        quoteAmountCents: { type: ["integer", "null"], multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], multipleOf: 1 }
    ContactRequest:
      type: object
      required: [nome_attivita, settore, whatsapp, privacy]
      properties:
        nome_attivita:
          type: string
          minLength: 2
          maxLength: 160
        settore:
          type: string
          minLength: 2
          maxLength: 120
        whatsapp:
          type: string
          minLength: 6
          maxLength: 30
        messaggio:
          type: string
          maxLength: 5000
        privacy:
          type: boolean
          enum: [true]
        marketingConsent:
          type: boolean
        analyticsConsent:
          type: boolean
        slug:
          type: string
          maxLength: 120
        variant:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        servizio:
          type: string
          enum: [generale, siti-web, web-app, menu-digitali, general, website_399, menu_qr_99, webapp_custom, sector_custom]
        pagina:
          type: string
          maxLength: 200
        attribution:
          type: object
          additionalProperties: false
          properties:
            utm_source: { type: string, maxLength: 200 }
            utm_medium: { type: string, maxLength: 200 }
            utm_campaign: { type: string, maxLength: 200 }
            utm_term: { type: string, maxLength: 200 }
            utm_content: { type: string, maxLength: 200 }
            gclid: { type: string, maxLength: 200 }
            gbraid: { type: string, maxLength: 200 }
            wbraid: { type: string, maxLength: 200 }
        website:
          type: string
          maxLength: 0
    ContactResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        leadId:
          type: string
        duplicate:
          type: boolean
        notification:
          type: string
          enum: [sent, pending]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

