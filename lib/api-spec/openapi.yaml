openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/login:
    post:
      operationId: loginAdmin
      summary: Accede all’unico pannello e crea una sessione HttpOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentialInput"
      responses:
        "200":
          description: Credenziale accettata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401": { description: Credenziale mancante o rifiutata }
        "429": { description: "Troppi tentativi, consultare Retry-After" }
        "503": { description: Password admin non configurata }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Sessione valida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Accesso richiesto }
  /admin/logout:
    post:
      operationId: logoutAdmin
      responses:
        "200":
          description: Sessione chiusa nel browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Statistiche reali
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/contacts:
    get:
      operationId: listAdminContacts
      responses:
        "200":
          description: Contatti ricevuti, inclusi messaggi ed email
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminContact" } }
  /admin/contacts/{id}:
    patch:
      operationId: updateAdminContact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactStateInput" }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContact" }
        "404": { description: Contatto non trovato }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      responses:
        "200":
          description: Recensioni pubblicate e in attesa
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminReview" } }
  /admin/reviews/{id}:
    patch:
      operationId: moderateAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewPublicationInput" }
      responses:
        "200":
          description: Pubblicazione aggiornata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReview" }
        "404": { description: Recensione non trovata }
    delete:
      operationId: deleteAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Recensione eliminata }
        "404": { description: Recensione non trovata }
  /admin/controlli:
    get:
      operationId: listAdminSiteControlRequests
      summary: Elenca le richieste di controllo sito
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SiteControlRequestStatus"
      responses:
        "200":
          description: Richieste di controllo ricevute
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSiteControlRequest" }
        "400": { description: Stato non valido }
  /admin/controlli/{id}:
    patch:
      operationId: updateAdminSiteControlRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteControlRequestStatusInput" }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSiteControlRequest" }
        "400": { description: Stato non valido }
        "404": { description: Richiesta non trovata }
  /admin/finance/workspace:
    get:
      operationId: getFinanceWorkspace
      responses:
        "200":
          description: Collegamenti storici, ricorrenze e rettifiche
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceWorkspace" }
  /admin/finance/recurring:
    post:
      operationId: saveFinanceRecurring
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceRecurringInput" }
      responses:
        "200": { description: Ricorrenza salvata }
  /admin/finance/recurring/{id}/generate:
    post:
      operationId: generateFinanceRecurring
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceRecurringGenerationInput" }
      responses:
        "200": { description: Prossima scadenza creata una sola volta }
  /admin/finance/quotes:
    get:
      operationId: listFinanceQuotes
      responses:
        "200":
          description: Preventivi interni del gestionale PromoApp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceQuotesResponse" }
    post:
      operationId: createFinanceQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceQuoteInput" }
      responses:
        "201":
          description: Preventivo creato con numero progressivo annuale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceQuote" }
        "400": { description: Dati del preventivo non validi }
  /admin/finance/quotes/{id}:
    patch:
      operationId: updateFinanceQuote
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceQuoteUpdate" }
      responses:
        "200":
          description: Preventivo aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceQuote" }
        "400": { description: Preventivo non modificabile o dati non validi }
        "404": { description: Preventivo non trovato }
  /admin/finance/quotes/{id}/status:
    post:
      operationId: updateFinanceQuoteStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceQuoteStatusInput" }
      responses:
        "200":
          description: Stato commerciale del preventivo aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceQuote" }
        "400": { description: Transizione di stato non valida }
        "404": { description: Preventivo non trovato }
  /admin/finance/quotes/{id}/convert:
    post:
      operationId: convertFinanceQuoteToProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceQuoteConversionInput" }
      responses:
        "201":
          description: Preventivo accettato e lavoro creato con rate collegate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceQuoteConversionResponse" }
        "400": { description: Piano pagamenti o lavoro non valido }
        "404": { description: Preventivo o cliente non trovato }
        "409": { description: Preventivo già convertito }
  /admin/finance/schedule:
    get:
      operationId: getFinanceSchedule
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: Scadenze, canoni, consegne e promemoria del mese
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceScheduleResponse" }
        "400": { description: Mese non valido }
  /admin/finance/manual-reminders:
    post:
      operationId: createFinanceManualReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceManualReminderInput" }
      responses:
        "201":
          description: Promemoria manuale creato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceManualReminder" }
        "400": { description: Dati del promemoria non validi }
  /admin/finance/manual-reminders/{id}:
    patch:
      operationId: updateFinanceManualReminder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceManualReminderUpdate" }
      responses:
        "200":
          description: Promemoria aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceManualReminder" }
        "404": { description: Promemoria non trovato }
  /admin/finance/reminders/{id}:
    get:
      operationId: getFinanceReminder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bozza manuale, nessun invio automatico
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceReminder" }
        "409": { description: Credito non confermato o non scaduto }
  /admin/finance/import-transactions/preview:
    post:
      operationId: previewFinanceTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceTransactionPreviewInput" }
      responses:
        "200":
          description: Confronto non modificante di transazioni reali
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceImportPreview" }
  /admin/finance/development-transfer:
    post:
      operationId: transferDevelopmentFinance
      summary: Trasferisce dati contabili solo in un archivio ancora vuoto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceDevelopmentTransferInput" }
      responses:
        "201":
          description: Dati contabili trasferiti senza transazioni inventate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDevelopmentTransferResult" }
        "400": { description: Archivio di trasferimento non valido }
        "409": { description: Il database contiene già dati contabili }
  /admin/finance/import-preview:
    get:
      operationId: getFinanceImportPreview
      responses:
        "200":
          description: Anteprima non modificante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceImportPreview" }
    post:
      operationId: confirmFinanceImport
      responses:
        "423": { description: Importazione definitiva bloccata in attesa di autorizzazione separata }
  /admin/finance/export:
    get:
      operationId: exportFinance
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
      responses:
        "200": { description: Esportazione riservata di dati e rettifiche }
  /admin/finance/documents:
    post:
      operationId: requestFinanceDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceDocumentInput" }
      responses:
        "200":
          description: Caricamento diretto riservato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDocumentUpload" }
  /admin/finance/documents/{id}:
    get:
      operationId: downloadFinanceDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Documento riservato }
  /admin/finance/settings:
    get:
      operationId: getFinanceSettings
      responses:
        "200":
          description: Intestazione e regimi fiscali configurati
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSettings" }
    put:
      operationId: updateFinanceSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceSettingsInput" }
      responses:
        "200":
          description: Impostazioni salvate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSettings" }
  /admin/finance/fiscal-documents:
    get:
      operationId: listFinanceFiscalDocuments
      responses:
        "200":
          description: Documenti fiscali del gestionale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceFiscalDocumentsResponse" }
    post:
      operationId: issueFinanceFiscalDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceFiscalDocumentInput" }
      responses:
        "201":
          description: Documento numerato e PDF archiviato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceFiscalDocument" }
  /admin/finance/fiscal-documents/{id}/pdf:
    get:
      operationId: downloadFinanceFiscalDocumentPdf
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: PDF fiscale riservato
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /admin/finance/fiscal-documents/{id}/void:
    post:
      operationId: voidFinanceFiscalDocument
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceFiscalDocumentVoidInput" }
      responses:
        "200":
          description: Documento annullato senza riutilizzare il numero
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceFiscalDocument" }
  /admin/finance:
    get:
      operationId: getAdminFinance
      summary: Elenca lavori e movimenti del bilancio interno
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Riepilogo mensile, lavori e movimenti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceData" }
        "400": { description: Mese non valido }
  /admin/finance/ledger:
    get:
      operationId: getFinanceLedger
      summary: Riepilogo del bilancio e prima nota
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Totali complessivi, periodo, scadenze e movimenti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceLedgerData" }
        "400": { description: Mese non valido }
  /admin/finance/ledger/accounts:
    post:
      operationId: createFinanceAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceAccountInput" }
      responses:
        "201":
          description: Conto creato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceAccount" }
        "400": { description: Dati del conto non validi }
        "409": { description: Nome conto già presente }
  /admin/finance/ledger/obligations:
    post:
      operationId: createFinanceObligation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceObligationInput" }
      responses:
        "201":
          description: Scadenza creata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceLedgerObligation" }
        "400": { description: Dati della scadenza non validi }
        "404": { description: "Cliente, lavoro o fornitore non trovato" }
  /admin/finance/ledger/movements:
    post:
      operationId: createFinanceMovement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceMovementInput" }
      responses:
        "201":
          description: Incasso o pagamento registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceLedgerMovement" }
        "400": { description: "Importo, conto o ripartizione non validi" }
        "404": { description: Conto o scadenza non trovati }
  /admin/finance/ledger/reconcile:
    post:
      operationId: reconcileFinanceHistory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceReconciliationInput" }
      responses:
        "201":
          description: Dato storico confermato e registrato come movimento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceLedgerMovement" }
        "400": { description: Data o importo da riconciliare non validi }
        "404": { description: Dato storico o conto non trovato }
        "409": { description: Dato storico già riconciliato }
  /admin/finance/clients:
    post:
      operationId: createAdminFinanceClient
      summary: Aggiunge un cliente all’anagrafica contabile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceClientInput" }
      responses:
        "201":
          description: Cliente registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceClient" }
        "400": { description: Dati cliente non validi }
        "409": { description: Cliente già presente }
  /admin/finance/clients/{id}:
    patch:
      operationId: updateAdminFinanceClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceClientUpdate" }
      responses:
        "200":
          description: Cliente aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceClient" }
        "400": { description: Dati cliente non validi }
        "404": { description: Cliente non trovato }
        "409": { description: Esiste già un cliente con questi dati }
  /admin/finance/suppliers:
    get:
      operationId: listAdminFinanceSuppliers
      responses:
        "200":
          description: Elenco fornitori del gestionale PromoApp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminFinanceSupplier" }
    post:
      operationId: createAdminFinanceSupplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceSupplierInput" }
      responses:
        "201":
          description: Fornitore registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceSupplier" }
        "409": { description: Fornitore già presente }
  /admin/finance/suppliers/{id}:
    patch:
      operationId: updateAdminFinanceSupplier
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceSupplierUpdate" }
      responses:
        "200":
          description: Fornitore aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceSupplier" }
        "404": { description: Fornitore non trovato }
  /admin/finance/projects:
    post:
      operationId: createAdminFinanceProject
      summary: Registra un nuovo lavoro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceProjectInput" }
      responses:
        "201":
          description: Lavoro registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceProject" }
        "400": { description: Dati non validi }
        "404": { description: Cliente non trovato }
  /admin/finance/projects/{id}:
    patch:
      operationId: updateAdminFinanceProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceProjectUpdate" }
      responses:
        "200":
          description: Lavoro aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceProject" }
        "400": { description: Dati non validi }
        "404": { description: Lavoro non trovato }
  /admin/finance/entries:
    post:
      operationId: createAdminFinanceEntry
      summary: Registra una scadenza, un incasso o una spesa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceEntryInput" }
      responses:
        "201":
          description: Movimento registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "400": { description: Dati non validi }
        "404": { description: Lavoro non trovato }
  /admin/finance/entries/{id}:
    patch:
      operationId: updateAdminFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceEntryUpdate" }
      responses:
        "200":
          description: Movimento aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "400": { description: Dati non validi }
        "404": { description: Movimento non trovato }
    delete:
      operationId: deleteAdminFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Movimento non pagato eliminato }
        "404": { description: Movimento non trovato o già pagato }
  /admin/finance/entries/{id}/paid:
    post:
      operationId: markAdminFinanceEntryPaid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Movimento segnato come pagato o incassato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "404": { description: Movimento non trovato }
  /visits:
    post:
      operationId: recordSiteVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteVisitInput" }
      responses:
        "204": { description: Visualizzazione registrata o duplicato ignorato }
        "400": { description: Dati o consenso non validi }
  /invia-contatto:
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Invia una richiesta di preventivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Richiesta salvata nel database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "500":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /controlli:
    post:
      operationId: submitSiteControlRequest
      tags: [contacts]
      summary: Richiede un controllo gratuito del sito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteControlRequestInput" }
      responses:
        "201":
          description: Richiesta ricevuta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteControlRequestReceipt" }
        "400": { description: Dati non validi o autorizzazione mancante }
        "403": { description: Origine non autorizzata }
        "429": { description: Limite richieste raggiunto }
        "503": { description: Salvataggio temporaneamente non disponibile }
  /marketing-config:
    get:
      operationId: getTrackingConfig
      responses:
        "200":
          description: Identificativi pubblici dei tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingConfig" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
