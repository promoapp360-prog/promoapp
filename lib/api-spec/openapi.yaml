openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/login:
    post:
      operationId: loginAdmin
      summary: Accede all’unico pannello e crea una sessione HttpOnly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentialInput"
      responses:
        "200":
          description: Credenziale accettata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401": { description: Credenziale mancante o rifiutata }
        "429": { description: "Troppi tentativi, consultare Retry-After" }
        "503": { description: Password admin non configurata }
  /admin/session:
    get:
      operationId: getAdminSession
      responses:
        "200":
          description: Sessione valida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Accesso richiesto }
  /admin/logout:
    post:
      operationId: logoutAdmin
      responses:
        "200":
          description: Sessione chiusa nel browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Statistiche reali
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/contacts:
    get:
      operationId: listAdminContacts
      responses:
        "200":
          description: Contatti ricevuti, inclusi messaggi ed email
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminContact" } }
  /admin/contacts/{id}:
    patch:
      operationId: updateAdminContact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactStateInput" }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContact" }
        "404": { description: Contatto non trovato }
  /admin/reviews:
    get:
      operationId: listAdminReviews
      responses:
        "200":
          description: Recensioni pubblicate e in attesa
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminReview" } }
  /admin/reviews/{id}:
    patch:
      operationId: moderateAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewPublicationInput" }
      responses:
        "200":
          description: Pubblicazione aggiornata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReview" }
        "404": { description: Recensione non trovata }
    delete:
      operationId: deleteAdminReview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Recensione eliminata }
        "404": { description: Recensione non trovata }
  /admin/controlli:
    get:
      operationId: listAdminSiteControlRequests
      summary: Elenca le richieste di controllo sito
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SiteControlRequestStatus"
      responses:
        "200":
          description: Richieste di controllo ricevute
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSiteControlRequest" }
        "400": { description: Stato non valido }
  /admin/controlli/{id}:
    patch:
      operationId: updateAdminSiteControlRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteControlRequestStatusInput" }
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSiteControlRequest" }
        "400": { description: Stato non valido }
        "404": { description: Richiesta non trovata }
  /admin/finance:
    get:
      operationId: getAdminFinance
      summary: Elenca lavori e movimenti del bilancio interno
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: Riepilogo mensile, lavori e movimenti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceData" }
        "400": { description: Mese non valido }
  /admin/finance/clients:
    post:
      operationId: createAdminFinanceClient
      summary: Aggiunge un cliente all’anagrafica contabile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceClientInput" }
      responses:
        "201":
          description: Cliente registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceClient" }
        "400": { description: Dati cliente non validi }
        "409": { description: Cliente già presente }
  /admin/finance/clients/{id}:
    patch:
      operationId: updateAdminFinanceClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceClientUpdate" }
      responses:
        "200":
          description: Cliente aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceClient" }
        "400": { description: Dati cliente non validi }
        "404": { description: Cliente non trovato }
        "409": { description: Esiste già un cliente con questi dati }
  /admin/finance/projects:
    post:
      operationId: createAdminFinanceProject
      summary: Registra un nuovo lavoro
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceProjectInput" }
      responses:
        "201":
          description: Lavoro registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceProject" }
        "400": { description: Dati non validi }
        "404": { description: Cliente non trovato }
  /admin/finance/projects/{id}:
    patch:
      operationId: updateAdminFinanceProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceProjectUpdate" }
      responses:
        "200":
          description: Lavoro aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceProject" }
        "400": { description: Dati non validi }
        "404": { description: Lavoro non trovato }
  /admin/finance/entries:
    post:
      operationId: createAdminFinanceEntry
      summary: Registra una scadenza, un incasso o una spesa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceEntryInput" }
      responses:
        "201":
          description: Movimento registrato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "400": { description: Dati non validi }
        "404": { description: Lavoro non trovato }
  /admin/finance/entries/{id}:
    patch:
      operationId: updateAdminFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinanceEntryUpdate" }
      responses:
        "200":
          description: Movimento aggiornato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "400": { description: Dati non validi }
        "404": { description: Movimento non trovato }
    delete:
      operationId: deleteAdminFinanceEntry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Movimento non pagato eliminato }
        "404": { description: Movimento non trovato o già pagato }
  /admin/finance/entries/{id}/paid:
    post:
      operationId: markAdminFinanceEntryPaid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Movimento segnato come pagato o incassato
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinanceEntry" }
        "404": { description: Movimento non trovato }
  /visits:
    post:
      operationId: recordSiteVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteVisitInput" }
      responses:
        "204": { description: Visualizzazione registrata o duplicato ignorato }
        "400": { description: Dati o consenso non validi }
  /invia-contatto:
    post:
      operationId: submitContact
      tags: [contacts]
      summary: Invia una richiesta di preventivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Richiesta salvata nel database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "500":
          description: Invio non riuscito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /controlli:
    post:
      operationId: submitSiteControlRequest
      tags: [contacts]
      summary: Richiede un controllo gratuito del sito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteControlRequestInput" }
      responses:
        "201":
          description: Richiesta ricevuta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteControlRequestReceipt" }
        "400": { description: Dati non validi o autorizzazione mancante }
        "403": { description: Origine non autorizzata }
        "429": { description: Limite richieste raggiunto }
        "503": { description: Salvataggio temporaneamente non disponibile }
  /marketing-config:
    get:
      operationId: getTrackingConfig
      responses:
        "200":
          description: Identificativi pubblici dei tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingConfig" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AdminCredentialInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        csrfToken: { type: string }
    AdminContact:
      type: object
      required: [id, nomeAttivita, settore, whatsapp, messaggio, servizio, stato, createdAt]
      properties:
        id: { type: string }
        nomeAttivita: { type: string }
        settore: { type: string }
        whatsapp: { type: string }
        email: { type: ["string", "null"] }
        messaggio: { type: string }
        servizio: { type: string }
        pagina: { type: string }
        stato: { type: string }
        createdAt: { type: string, format: date-time }
    ContactStateInput:
      type: object
      required: [stato]
      properties:
        stato:
          type: string
          enum: [Nuovo, Contattato, Interessato, Preventivo inviato, Cliente acquisito, Non interessato]
    AdminReview:
      type: object
      required: [id, nome, attivita, testo, stelle, verificata, createdAt]
      properties:
        id: { type: string }
        nome: { type: string }
        attivita: { type: string }
        testo: { type: string }
        stelle: { type: string }
        verificata: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReviewPublicationInput:
      type: object
      required: [verificata]
      properties:
        verificata: { type: boolean }
    SiteVisitInput:
      type: object
      required: [id, sessionId, path, analyticsConsent]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        path: { type: string, minLength: 1, maxLength: 200 }
        analyticsConsent: { type: boolean, enum: [true] }
    VisitDay:
      type: object
      required: [date, visits, pageViews]
      properties:
        date: { type: string }
        visits: { type: integer }
        pageViews: { type: integer }
    VisitedPage:
      type: object
      required: [path, pageViews]
      properties:
        path: { type: string }
        pageViews: { type: integer }
    LandingVisitStats:
      type: object
      required: [path, visits, pageViews, totalVisits, totalPageViews]
      properties:
        path: { type: string }
        visits: { type: integer }
        pageViews: { type: integer }
        totalVisits: { type: integer }
        totalPageViews: { type: integer }
    AdminOverview:
      type: object
      required: [days, contacts, newContacts, reviews, pendingReviews, averageRating, visits, pageViews, trackingStartedAt, daily, pages, sitiweb]
      properties:
        sitiweb: { $ref: "#/components/schemas/LandingVisitStats" }
        days: { type: integer }
        contacts: { type: integer }
        newContacts: { type: integer }
        reviews: { type: integer }
        pendingReviews: { type: integer }
        averageRating: { type: ["number", "null"] }
        visits: { type: integer }
        pageViews: { type: integer }
        trackingStartedAt: { type: ["string", "null"], format: date-time }
        daily: { type: array, items: { $ref: "#/components/schemas/VisitDay" } }
        pages: { type: array, items: { $ref: "#/components/schemas/VisitedPage" } }
    AdminFinanceProject:
      type: object
      required: [id, clientId, clientName, name, totalAmountCents, paymentType, depositAmountCents, installmentCount, notes, active, createdAt, receivedCents, outstandingCents]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: ["string", "null"], format: uuid }
        clientName: { type: string }
        name: { type: string }
        totalAmountCents: { type: integer, minimum: 0, maximum: 2147483647, multipleOf: 1 }
        paymentType: { type: string, enum: [single, advance, installments] }
        depositAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        installmentCount: { type: ["integer", "null"], minimum: 2, maximum: 60, multipleOf: 1 }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        receivedCents: { type: integer, minimum: 0, multipleOf: 1 }
        outstandingCents: { type: integer, minimum: 0, multipleOf: 1 }
    AdminFinanceEntry:
      type: object
      required: [id, projectId, projectName, clientName, direction, category, description, amountCents, dueDate, paidAt, repeatMonthly, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: ["string", "null"], format: uuid }
        projectName: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }
        direction: { type: string, enum: [income, expense] }
        category: { type: string, enum: [deposit, balance, monthly_fee, facebook, replit, other] }
        description: { type: string }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647, multipleOf: 1 }
        dueDate: { type: string, format: date }
        paidAt: { type: ["string", "null"], format: date-time }
        repeatMonthly: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminFinanceSummary:
      type: object
      required: [month, receivedCents, expensesCents, balanceCents, outstandingCents, overdueIncomeCents, unpaidExpensesCents]
      properties:
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
        receivedCents: { type: integer, multipleOf: 1 }
        expensesCents: { type: integer, multipleOf: 1 }
        balanceCents: { type: integer, multipleOf: 1 }
        outstandingCents: { type: integer, multipleOf: 1 }
        overdueIncomeCents: { type: integer, multipleOf: 1 }
        unpaidExpensesCents: { type: integer, multipleOf: 1 }
    AdminFinanceData:
      type: object
      required: [summary, clients, projects, entries]
      properties:
        summary: { $ref: "#/components/schemas/AdminFinanceSummary" }
        clients: { type: array, items: { $ref: "#/components/schemas/AdminFinanceClient" } }
        projects: { type: array, items: { $ref: "#/components/schemas/AdminFinanceProject" } }
        entries: { type: array, items: { $ref: "#/components/schemas/AdminFinanceEntry" } }
    AdminFinanceClient:
      type: object
      required: [id, name, companyName, email, phone, notes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        companyName: { type: ["string", "null"] }
        email: { type: ["string", "null"], format: email }
        phone: { type: ["string", "null"] }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
    FinanceClientInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        companyName: { type: ["string", "null"], maxLength: 160 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 60 }
        notes: { type: string, maxLength: 4000 }
    FinanceClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        companyName: { type: ["string", "null"], maxLength: 160 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 60 }
        notes: { type: string, maxLength: 4000 }
    FinanceProjectInput:
      type: object
      required: [clientId, name, totalAmountCents, paymentType]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        totalAmountCents: { type: integer, minimum: 0, maximum: 2147483647, multipleOf: 1 }
        paymentType: { type: string, enum: [single, advance, installments] }
        depositAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        installmentCount: { type: ["integer", "null"], minimum: 2, maximum: 60, multipleOf: 1 }
        notes: { type: string, maxLength: 4000 }
    FinanceProjectUpdate:
      type: object
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        totalAmountCents: { type: integer, minimum: 0, maximum: 2147483647, multipleOf: 1 }
        paymentType: { type: string, enum: [single, advance, installments] }
        depositAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        installmentCount: { type: ["integer", "null"], minimum: 2, maximum: 60, multipleOf: 1 }
        notes: { type: string, maxLength: 4000 }
        active: { type: boolean }
    FinanceEntryInput:
      type: object
      required: [direction, category, description, amountCents, dueDate]
      properties:
        projectId: { type: ["string", "null"], format: uuid }
        direction: { type: string, enum: [income, expense] }
        category: { type: string, enum: [deposit, balance, monthly_fee, facebook, replit, other] }
        description: { type: string, minLength: 1, maxLength: 240 }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647, multipleOf: 1 }
        dueDate: { type: string, format: date }
        paid: { type: boolean, default: false }
        repeatMonthly: { type: boolean, default: false }
    FinanceEntryUpdate:
      type: object
      properties:
        category: { type: string, enum: [deposit, balance, monthly_fee, facebook, replit, other] }
        description: { type: string, minLength: 1, maxLength: 240 }
        amountCents: { type: integer, minimum: 1, maximum: 2147483647, multipleOf: 1 }
        dueDate: { type: string, format: date }
        repeatMonthly: { type: boolean }
    TrackingConfig:
      type: object
      properties:
        gtmId: { type: string }
        ga4Id: { type: string }
        googleAdsId: { type: string }
        googleAdsLeadLabel: { type: string }
        googleAdsWhatsAppLabel: { type: string }
        metaPixelId: { type: string }
    LeadUpdate:
      type: object
      required: [stato]
      properties:
        qualified: { type: boolean }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        stato:
          type: string
          enum: [Nuovo, Contattato, Interessato, Preventivo inviato, Cliente acquisito, Non interessato]
    CommercialLead:
      type: object
      required: [id, nomeAttivita, settore, whatsapp, slug, stato, pagina, attribution, createdAt, notification, marketingConsent, analyticsConsent, events]
      properties:
        id: { type: string }
        nomeAttivita: { type: string }
        settore: { type: string }
        whatsapp: { type: string }
        slug: { type: string }
        servizio: { type: string }
        pagina: { type: string }
        variant: { type: string }
        stato: { type: string }
        notification: { type: string }
        createdAt: { type: string, format: date-time }
        qualifiedAt: { type: ["string", "null"], format: date-time }
        quoteAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, multipleOf: 1 }
        marketingConsent: { type: boolean }
        analyticsConsent: { type: boolean }
        attribution: { type: object, additionalProperties: { type: string } }
        events:
          type: array
          items: { $ref: "#/components/schemas/LeadEvent" }
    LeadEvent:
      type: object
      required: [event, at]
      properties:
        event: { type: string }
        at: { type: string }
        quoteAmountCents: { type: ["integer", "null"], multipleOf: 1 }
        saleAmountCents: { type: ["integer", "null"], multipleOf: 1 }
    ContactRequest:
      type: object
      required: [nome_attivita, settore, whatsapp, privacy]
      properties:
        nome_attivita:
          type: string
          minLength: 2
          maxLength: 160
        settore:
          type: string
          minLength: 2
          maxLength: 120
        whatsapp:
          type: string
          minLength: 6
          maxLength: 30
        messaggio:
          type: string
          maxLength: 5000
        privacy:
          type: boolean
          enum: [true]
        marketingConsent:
          type: boolean
        analyticsConsent:
          type: boolean
        slug:
          type: string
          maxLength: 120
        variant:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        servizio:
          type: string
          enum: [generale, siti-web, web-app, menu-digitali, general, website_399, menu_qr_99, webapp_custom, sector_custom]
        pagina:
          type: string
          maxLength: 200
        attribution:
          type: object
          additionalProperties: false
          properties:
            utm_source: { type: string, maxLength: 200 }
            utm_medium: { type: string, maxLength: 200 }
            utm_campaign: { type: string, maxLength: 200 }
            utm_term: { type: string, maxLength: 200 }
            utm_content: { type: string, maxLength: 200 }
            gclid: { type: string, maxLength: 200 }
            gbraid: { type: string, maxLength: 200 }
