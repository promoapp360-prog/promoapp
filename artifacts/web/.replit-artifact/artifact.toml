kind = "web"
previewPath = "/"
title = "Web App"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
publicDir = "artifacts/web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/siti-web"
to = "/siti-web/index.html"

[[services.production.rewrites]]
from = "/web-app"
to = "/web-app/index.html"

[[services.production.rewrites]]
from = "/menu-digitali"
to = "/menu-digitali/index.html"

[[services.production.rewrites]]
from = "/menu-demo"
to = "/menu-demo/index.html"

[[services.production.rewrites]]
from = "/preventivo"
to = "/preventivo/index.html"

[[services.production.rewrites]]
from = "/siti-web/"
to = "/siti-web/index.html"

[[services.production.rewrites]]
from = "/web-app/"
to = "/web-app/index.html"

[[services.production.rewrites]]
from = "/menu-digitali/"
to = "/menu-digitali/index.html"

[[services.production.rewrites]]
from = "/menu-demo/"
to = "/menu-demo/index.html"

[[services.production.rewrites]]
from = "/preventivo/"
to = "/preventivo/index.html"

[[services.production.rewrites]]
from = "/grazie/"
to = "/grazie/index.html"

[[services.production.rewrites]]
from = "/gestione-contatti/"
to = "/gestione-contatti/index.html"

[[services.production.rewrites]]
from = "/grazie"
to = "/grazie/index.html"

[[services.production.rewrites]]
from = "/gestione-contatti"
to = "/gestione-contatti/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22333"
BASE_PATH = "/"
